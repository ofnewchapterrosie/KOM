name = "komwind-worker"
main = "worker.js"
compatibility_date = "2024-01-01"

# Environment Variables werden im Cloudflare Dashboard gesetzt:
# Settings → Variables and Secrets
#   STRAVA_CLIENT_ID     = "12345"
#   STRAVA_CLIENT_SECRET = "dein_secret"  ← als Secret, nicht plain text!
#   APP_ORIGIN           = "https://pumpingflo.github.io"

[vars]
APP_ORIGIN = "https://pumpingflo.github.io"

# Für Token-Persistenz (optional, siehe worker.js)
# [[kv_namespaces]]
# binding = "TOKENS"
# id = "DEINE_KV_NAMESPACE_ID"
