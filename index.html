<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#080808" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="KOM Reaper" />
  <meta name="description" content="Reap the KOMs. Wind-optimierte KOM-Jagd mit Strava." />

  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/reaper-logo.png" />
  <link rel="icon" type="image/png" href="icons/reaper-logo.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />

  <title>KOM Reaper</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>

  <header class="app-header">
    <div class="header-inner">
      <div class="logo">
        <img src="icons/reaper-logo.png" alt="KOM Reaper" class="logo-img" />
        <span class="logo-text">KOM <span class="logo-accent">REAPER</span></span>
      </div>
      <button class="icon-btn" id="refresh-btn" aria-label="Aktualisieren">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="app-main">

    <!-- ── AUTH ── -->
    <section class="screen active" id="screen-auth">
      <div class="auth-hero">
        <div class="reaper-logo-wrap">
          <img src="icons/reaper-logo.png" alt="KOM Reaper" class="reaper-logo" />
        </div>
        <h1 class="hero-title">KOM<br/>REAPER</h1>
        <p class="hero-slogan">Reap the KOMs.</p>
        <div class="auth-divider"></div>
      </div>

      <button class="btn-primary" id="connect-strava-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M15.387 17.944l-2.089-4.116h-3.065L15.387 24l5.15-10.172h-3.066m-7.008-5.599l2.836 5.598h4.172L10.463 0l-7 13.828h4.169"/>
        </svg>
        Mit Strava verbinden
      </button>

      <p class="auth-note">Nur Lesezugriff · Keine Datenspeicherung</p>
    </section>

    <!-- ── LOADING ── -->
    <section class="screen" id="screen-loading">
      <div class="loading-state">
        <div class="reaper-loader">
          <img src="icons/reaper-logo.png" alt="" />
        </div>
        <p class="loading-text loading-dots" id="loading-text">Lade Segmente</p>
      </div>
    </section>

    <!-- ── SEGMENTS ── -->
    <section class="screen" id="screen-segments">
      <div class="section-header">
        <h2 class="section-title">Deine Segmente</h2>
        <div class="weather-pill" id="weather-pill">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
          </svg>
          <span id="weather-summary">–</span>
        </div>
      </div>
      <div class="segments-list" id="segments-list" role="list"></div>
    </section>

    <!-- ── DETAIL ── -->
    <section class="screen" id="screen-detail">
      <button class="back-btn" id="back-btn" aria-label="Zurück">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>
        Alle Segmente
      </button>

      <div class="detail-hero">
        <div class="wind-score-ring" id="detail-ring">
          <div class="ring-label">
            <span class="ring-value" id="detail-tailwind">—</span>
            <span class="ring-unit">km/h</span>
          </div>
        </div>
        <h2 class="detail-name" id="detail-name">—</h2>
        <p class="detail-meta" id="detail-meta">—</p>
      </div>

      <div class="detail-rating" id="detail-rating">
        <span class="rating-icon" id="detail-icon"></span>
        <div>
          <p class="rating-label" id="detail-label">—</p>
          <p class="rating-sub" id="detail-sub">—</p>
        </div>
      </div>

      <div class="detail-stats">
        <div class="stat-card">
          <p class="stat-label">Windstärke</p>
          <p class="stat-value" id="detail-wspeed">—</p>
        </div>
        <div class="stat-card">
          <p class="stat-label">Windrichtung</p>
          <p class="stat-value" id="detail-wdir">—</p>
        </div>
        <div class="stat-card">
          <p class="stat-label">Steigung</p>
          <p class="stat-value" id="detail-gradient">—</p>
        </div>
        <div class="stat-card">
          <p class="stat-label">Wind-Relevanz</p>
          <p class="stat-value" id="detail-relevance">—</p>
        </div>
      </div>

      <div class="forecast-section">
        <h3 class="forecast-title">// Nächste 12 Stunden</h3>
        <div class="forecast-list" id="forecast-list"></div>
      </div>
    </section>

  </main>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(r => console.log('[SW] Registered:', r.scope))
          .catch(e => console.warn('[SW] Failed:', e));
      });
    }
  </script>
  <script src="js/wind.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
